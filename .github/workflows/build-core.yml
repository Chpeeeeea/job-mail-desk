name: Build JobMailDesk Core

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest
      - shell: pwsh
        run: ./scripts/secret-scan.ps1
      - shell: pwsh
        run: ./scripts/build.ps1 -OutputRoot "$PWD/release"
      - shell: pwsh
        run: ./scripts/package-core.ps1 -ExePath "$PWD/release/JobMailDesk.exe" -OutputDirectory "$PWD/release"
      - uses: actions/upload-artifact@v4
        with:
          name: JobMailDesk-Core-v0.3.0-win-x64
          path: |
            release/JobMailDesk-Core-v0.3.0-win-x64.zip
            release/JobMailDesk-Core-v0.3.0-win-x64.zip.sha256
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest
      - name: Build macOS app
        working-directory: packaging/macos
        run: uv run --project ../.. python setup.py py2app
      - name: Package app
        run: |
          built_app="$(find packaging/macos/dist -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$built_app"
          if [ "$built_app" != "packaging/macos/dist/JobMailDesk.app" ]; then
            mv "$built_app" packaging/macos/dist/JobMailDesk.app
          fi
          plutil -lint packaging/macos/dist/JobMailDesk.app/Contents/Info.plist
          test -n "$(find packaging/macos/dist/JobMailDesk.app/Contents/MacOS -type f -perm -111 -print -quit)"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent packaging/macos/dist/JobMailDesk.app "release/JobMailDesk-Core-v0.3.0-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "release/JobMailDesk-Core-v0.3.0-macos-${{ matrix.arch }}.zip" > "release/JobMailDesk-Core-v0.3.0-macos-${{ matrix.arch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: JobMailDesk-Core-v0.3.0-macos-${{ matrix.arch }}
          path: |
            release/JobMailDesk-Core-v0.3.0-macos-${{ matrix.arch }}.zip
            release/JobMailDesk-Core-v0.3.0-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-x64
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -f "$notes"
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "JobMailDesk Core $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --prerelease \
            --verify-tag
