<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobMailDesk</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="drag-strip pywebview-drag-region" title="拖动纸片"></div>
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL JOB DESK</div>
        <h1>求职纸片</h1>
      </div>
      <div class="top-actions">
        <button id="addButton" class="icon-button" title="新建任务">＋</button>
        <button id="capsuleButton" class="icon-button" title="胶囊模式">▯</button>
        <button id="scanButton" class="icon-button" title="立即扫描">↻</button>
      </div>
    </header>

    <section id="capsuleView" class="capsule-view">
      <button id="expandButton" title="展开 JobMailDesk">
        <span class="capsule-mark">J</span>
        <strong id="capsuleTime">--:--</strong>
        <span id="capsuleCompany">暂无任务</span>
        <small>点击展开</small>
      </button>
    </section>

    <section id="urgentStrip" class="urgent-strip hidden"></section>

    <nav class="tabs" aria-label="任务视图">
      <button class="tab active" data-view="today">今天 <span id="countToday">0</span></button>
      <button class="tab" data-view="week">周历 <span id="countWeek">0</span></button>
      <button class="tab" data-view="month">月历 <span id="countMonth">0</span></button>
      <button class="tab" data-view="review">待确认 <span id="countReview">0</span></button>
      <button class="tab" data-view="research">研究 <span id="countResearch">0</span></button>
    </nav>

    <main id="cards" class="cards"></main>

    <footer>
      <span id="healthDot" class="health-dot"></span>
      <span id="healthText">读取本地任务中…</span>
      <button id="refreshButton" class="text-button">刷新</button>
    </footer>

    <template id="taskTemplate">
      <article class="task-card">
        <div class="card-head">
          <div>
            <div class="company"></div>
            <div class="role"></div>
          </div>
          <div class="time-box">
            <div class="time-label"></div>
            <div class="remaining"></div>
          </div>
        </div>
        <div class="meta">
          <span class="stage"></span>
          <span class="round"></span>
          <span class="research"></span>
        </div>
        <p class="action"></p>
        <div class="actions">
          <button data-action="done">完成</button>
          <button data-action="confirm">确认</button>
          <button data-action="snooze">延后</button>
          <button data-action="source">来源</button>
          <button data-action="obsidian">Obsidian</button>
          <button data-action="edit">编辑</button>
          <button data-action="ignore" class="muted">忽略</button>
        </div>
      </article>
    </template>

    <dialog id="taskDialog">
      <form id="taskForm" method="dialog">
        <div class="dialog-head">
          <div>
            <div class="eyebrow">MARKDOWN TASK</div>
            <h2 id="dialogTitle">新建求职任务</h2>
          </div>
          <button type="button" id="closeDialog" class="dialog-close">×</button>
        </div>
        <input type="hidden" name="task_id">
        <label>公司 / 事项<input name="company" required maxlength="80"></label>
        <label>岗位<input name="role" maxlength="80"></label>
        <div class="form-row">
          <label>阶段<input name="stage" value="自定义待办" maxlength="40"></label>
          <label>轮次<input name="round" maxlength="30"></label>
        </div>
        <div class="form-row">
          <label>开始<input name="start_at" type="datetime-local"></label>
          <label>结束<input name="end_at" type="datetime-local"></label>
        </div>
        <label>硬截止<input name="deadline_at" type="datetime-local"></label>
        <label>下一步行动<textarea name="action_summary" rows="2" required maxlength="240"></textarea></label>
        <label>Markdown 手动补充<textarea name="manual_notes" rows="4" maxlength="2000" placeholder="准备材料、问题清单、复盘备注……"></textarea></label>
        <div id="formError" class="form-error"></div>
        <div class="dialog-actions">
          <button type="button" id="cancelDialog">取消</button>
          <button type="submit" class="primary">保存到 Markdown</button>
        </div>
      </form>
    </dialog>

    <dialog id="createDialog" class="quick-create">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">NEW PAPER</div>
          <h2>新建</h2>
        </div>
        <button type="button" id="closeCreateDialog" class="dialog-close">×</button>
      </div>
      <button data-create="job">求职任务<small>进入日历与邮件工作流</small></button>
      <button data-create="todo">待办纸<small>独立窗口，一行一个事项</small></button>
      <button data-create="note">笔记纸<small>独立 Markdown 笔记</small></button>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
