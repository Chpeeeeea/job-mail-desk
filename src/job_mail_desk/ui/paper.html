<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobMailDesk Paper</title>
    <link rel="stylesheet" href="paper.css">
  </head>
  <body data-theme="warm">
    <div class="paper-drag pywebview-drag-region" title="拖动纸片">
      <span></span><span></span><span></span>
    </div>

    <header class="paper-head">
      <div class="paper-identity">
        <span id="kindMark" class="kind-mark">✓</span>
        <input id="paperTitle" aria-label="纸片标题" maxlength="80">
      </div>
      <div class="paper-actions">
        <button id="newPaper" title="新建纸片">＋</button>
        <button id="externalButton" title="用外部 Markdown 编辑器打开">MD</button>
        <button id="settingsButton" title="纸片设置">◌</button>
        <button id="collapseButton" title="折叠为侧边胶囊">▯</button>
        <button id="closeButton" title="关闭纸片">×</button>
      </div>
    </header>
    <div id="loadError" class="load-error hidden"></div>

    <section id="todoPaper" class="paper-content hidden">
      <div class="todo-compose">
        <textarea id="todoInput" rows="1" placeholder="写下待办，粘贴多行会自动拆分…"></textarea>
        <button id="addTodo">＋</button>
      </div>
      <div id="todoList" class="todo-list"></div>
      <footer class="todo-footer">
        <span id="todoCount">0 项</span>
        <button id="undoButton">撤销</button>
        <button id="redoButton">重做</button>
        <button id="clearCompleted">清理已完成</button>
      </footer>
    </section>

    <section id="notePaper" class="paper-content note-paper hidden">
      <div class="note-toolbar">
        <button data-format="bold" title="Ctrl+B"><b>B</b></button>
        <button data-format="italic" title="Ctrl+I"><i>I</i></button>
        <button data-format="link" title="Ctrl+K">↗</button>
        <button id="insertImage" title="插入本地图片">▧</button>
        <input id="imagePicker" type="file" accept="image/*" hidden>
        <span class="toolbar-spacer"></span>
        <button class="level active" data-level="plain">原文</button>
        <button class="level" data-level="balanced">平衡</button>
        <button class="level" data-level="rich">渲染</button>
      </div>
      <div class="note-workspace">
        <textarea id="noteEditor" spellcheck="false"></textarea>
        <article id="notePreview" class="note-preview hidden"></article>
      </div>
      <footer class="note-footer">
        <span id="saveState">已保存</span>
        <button id="zoomOut">−</button>
        <button id="zoomReset">100%</button>
        <button id="zoomIn">＋</button>
      </footer>
    </section>

    <aside id="settingsPanel" class="settings-panel hidden">
      <div class="settings-head">
        <strong>纸片外观</strong>
        <button id="closeSettings">×</button>
      </div>
      <label>配色
        <select id="themeSelect">
          <option value="warm">暖纸</option>
          <option value="ink">墨</option>
          <option value="forest">林</option>
          <option value="sunset">霞</option>
          <option value="system">跟随系统</option>
        </select>
      </label>
      <label>字体
        <select id="fontSelect">
          <option value="system">系统默认</option>
          <option value="yahei">微软雅黑</option>
          <option value="deng">等线</option>
        </select>
      </label>
      <label>整体字号
        <input id="scaleInput" type="range" min="80" max="120" step="5">
        <output id="scaleOutput">100%</output>
      </label>
      <label class="check-row"><input id="autoClear" type="checkbox">完成后自动清理</label>
      <label class="check-row"><input id="autoSnap" type="checkbox">胶囊自动贴边</label>
      <div class="danger-zone">
        <button id="trashButton">移到本地回收区</button>
      </div>
    </aside>

    <section id="capsule" class="paper-capsule">
      <button id="expandCapsule">
        <span id="capsuleKind">✓</span>
        <strong id="capsuleBadge">0</strong>
        <i></i>
      </button>
    </section>

    <dialog id="newDialog">
      <strong>新建纸片</strong>
      <button data-new-kind="todo">待办纸</button>
      <button data-new-kind="note">笔记纸</button>
      <button id="cancelNew">取消</button>
    </dialog>

    <template id="todoTemplate">
      <div class="todo-row">
        <input class="todo-check" type="checkbox">
        <textarea class="todo-text" rows="1"></textarea>
        <button class="todo-note" title="关联笔记">◇</button>
        <button class="todo-delete" title="删除">×</button>
        <button class="todo-handle" draggable="true" title="按住拖动排序">≡</button>
      </div>
    </template>

    <script>
      window.addEventListener("error", (event) => {
        const target = document.getElementById("loadError");
        if (target) {
          target.textContent = `纸片脚本错误：${event.message}`;
          target.classList.remove("hidden");
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        const target = document.getElementById("loadError");
        if (target) {
          target.textContent = `纸片接口错误：${event.reason}`;
          target.classList.remove("hidden");
        }
      });
    </script>
    <script src="paper.js" onerror="document.getElementById('loadError').classList.remove('hidden'); document.getElementById('loadError').textContent='paper.js 加载失败';"></script>
  </body>
</html>
